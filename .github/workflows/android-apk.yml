name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "android-v*"
    paths:
      - ".github/workflows/android-apk.yml"
      - "agent/**"
      - "assets/**"
      - "preset/**"
      - "resource_pack/**"
      - "tasks/**"
      - "interface.json"
      - "pi-profile.yaml"
      - "README.md"
      - "LICENSE"
permissions:
  contents: write

env:
  GO_VERSION: "1.24"
  MAAFW_VERSION: v5.13.0-beta.2
  MAAFWAPP_REPOSITORY: Aliothmoon/MaaFwApp
  MAAFWAPP_REF: b2b0f5401693befd470f2e3f6681240ef4cfc22c
  ANDROID_API: "28"
  ANDROID_PLATFORM: "37.0"
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK: 28.2.13676358
  ANDROID_CMAKE: 3.22.1

jobs:
  build-apk:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout MaaYYs
        uses: actions/checkout@v4

      - name: Checkout MaaFwApp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAAFWAPP_REPOSITORY }}
          ref: ${{ env.MAAFWAPP_REF }}
          path: MaaFwApp
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            MaaFwApp/**/*.gradle*
            MaaFwApp/gradle/**/*.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Android SDK components
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Resolve APK version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/android-v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "${tag}" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid Android release tag: ${tag}"
              exit 1
            fi
            version="${tag#android-}"
          else
            version="ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=MaaYYs-android-${version}.apk" >> "${GITHUB_OUTPUT}"

      - name: Test Go Agent
        working-directory: agent
        shell: bash
        run: |
          go test ./...
          go build ./...

      - name: Build Android Agents
        working-directory: agent
        shell: bash
        env:
          GOOS: android
          CGO_ENABLED: "1"
          AGENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          build_agent() {
            local abi="$1"
            local goarch="$2"
            local compiler_prefix="$3"
            local output="../agent-dist/${abi}/jniLibs/libmaayys_agent.so"

            mkdir -p "$(dirname "${output}")"
            GOARCH="${goarch}" \
            CC="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/${compiler_prefix}-linux-android${ANDROID_API}-clang" \
            go build -trimpath \
              -ldflags="-s -w -X main.Version=${AGENT_VERSION}" \
              -o "${output}" \
              .
            test -s "${output}"
          }

          build_agent arm64-v8a arm64 aarch64
          build_agent x86_64 amd64 x86_64

      - name: Configure MaaFwApp
        shell: bash
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "pi.profile=${GITHUB_WORKSPACE}/pi-profile.yaml"
          } > MaaFwApp/local.properties

      - name: Install MaaFramework Android libraries
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python MaaFwApp/scripts/setup_maa_framework.py \
            --tag "${MAAFW_VERSION}" \
            --abi all

      - name: Build Debug APK
        working-directory: MaaFwApp
        shell: bash
        run: bash ./gradlew :app:assembleDebug --console=plain

      - name: Verify APK
        shell: bash
        env:
          ASSET_NAME: ${{ steps.version.outputs.asset_name }}
        run: |
          source_apk="MaaFwApp/app/build/outputs/apk/debug/app-debug.apk"
          final_apk="dist/${ASSET_NAME}"
          test -s "${source_apk}"
          mkdir -p dist
          cp "${source_apk}" "${final_apk}"

          unzip -Z1 "${final_apk}" > "${RUNNER_TEMP}/apk-entries.txt"
          for abi in arm64-v8a x86_64; do
            grep -Fxq "lib/${abi}/libmaayys_agent.so" "${RUNNER_TEMP}/apk-entries.txt"
            grep -Fxq "lib/${abi}/libMaaFramework.so" "${RUNNER_TEMP}/apk-entries.txt"
            grep -Fxq "lib/${abi}/libMaaAndroidNativeControlUnit.so" "${RUNNER_TEMP}/apk-entries.txt"
          done
          grep -Fxq "assets/pi.zip" "${RUNNER_TEMP}/apk-entries.txt"
          if grep -Eq '^lib/(armeabi-v7a|x86)/.*\.so$' "${RUNNER_TEMP}/apk-entries.txt"; then
            echo "::error::APK contains an unexpected 32-bit native library."
            exit 1
          fi

          unzip -p "${final_apk}" assets/pi.zip > "${RUNNER_TEMP}/pi.zip"
          unzip -Z1 "${RUNNER_TEMP}/pi.zip" > "${RUNNER_TEMP}/pi-entries.txt"
          grep -Fxq "interface.json" "${RUNNER_TEMP}/pi-entries.txt"
          grep -Eq '^tasks/.+' "${RUNNER_TEMP}/pi-entries.txt"
          grep -Eq '^resource_pack/.+/pipeline/.+' "${RUNNER_TEMP}/pi-entries.txt"

          "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" \
            verify --verbose "${final_apk}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset_name }}
          path: dist/${{ steps.version.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android prerelease
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          name: MaaYYs Android ${{ steps.version.outputs.version }}
          files: dist/${{ steps.version.outputs.asset_name }}
          fail_on_unmatched_files: true
          prerelease: true
          draft: false
          generate_release_notes: true
