name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/android-apk.yml"
      - "agent/**"
      - "assets/**"
      - "preset/**"
      - "resource_pack/**"
      - "tasks/**"
      - "interface.json"
      - "pi-profile.yaml"
      - "README.md"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/workflows/android-apk.yml"
      - "agent/**"
      - "assets/**"
      - "preset/**"
      - "resource_pack/**"
      - "tasks/**"
      - "interface.json"
      - "pi-profile.yaml"
      - "README.md"
      - "LICENSE"

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  MAAFW_VERSION: v5.13.0-beta.2
  MAAFWAPP_REPOSITORY: Aliothmoon/MaaFwApp
  MAAFWAPP_REF: b2b0f5401693befd470f2e3f6681240ef4cfc22c
  ANDROID_API: "28"
  ANDROID_PLATFORM: "37.0"
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK: 28.2.13676358
  ANDROID_CMAKE: 3.22.1

jobs:
  build-apk:
    name: Android ARM64 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout MaaYYs
        uses: actions/checkout@v4

      - name: Checkout MaaFwApp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAAFWAPP_REPOSITORY }}
          ref: ${{ env.MAAFWAPP_REF }}
          path: MaaFwApp
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            MaaFwApp/**/*.gradle*
            MaaFwApp/gradle/**/*.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Android SDK components
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Test Go Agent
        working-directory: agent
        shell: bash
        run: |
          go test ./...
          go build ./...

      - name: Build Android ARM64 Agent
        working-directory: agent
        shell: bash
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          export CC="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          mkdir -p ../agent-dist/arm64-v8a/jniLibs
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o ../agent-dist/arm64-v8a/jniLibs/libmaayys_agent.so \
            .
          test -s ../agent-dist/arm64-v8a/jniLibs/libmaayys_agent.so

      - name: Configure MaaFwApp
        shell: bash
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "pi.profile=${GITHUB_WORKSPACE}/pi-profile.yaml"
            echo "build.debugAbi=arm64-v8a"
          } > MaaFwApp/local.properties

      - name: Install MaaFramework Android ARM64
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python MaaFwApp/scripts/setup_maa_framework.py \
            --tag "${MAAFW_VERSION}" \
            --abi arm64-v8a

      - name: Build Debug APK
        working-directory: MaaFwApp
        shell: bash
        run: bash ./gradlew :app:assembleDebug --console=plain

      - name: Verify APK
        shell: bash
        run: |
          APK="MaaFwApp/app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK}"
          unzip -Z1 "${APK}" > "${RUNNER_TEMP}/apk-entries.txt"
          grep -Fxq "lib/arm64-v8a/libmaayys_agent.so" "${RUNNER_TEMP}/apk-entries.txt"
          grep -Fxq "lib/arm64-v8a/libMaaFramework.so" "${RUNNER_TEMP}/apk-entries.txt"
          grep -Fxq "lib/arm64-v8a/libMaaAndroidNativeControlUnit.so" "${RUNNER_TEMP}/apk-entries.txt"
          grep -Fxq "assets/pi.zip" "${RUNNER_TEMP}/apk-entries.txt"
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/.*\.so$' "${RUNNER_TEMP}/apk-entries.txt"; then
            echo "::error::APK contains an unexpected non-ARM64 native library."
            exit 1
          fi

          unzip -p "${APK}" assets/pi.zip > "${RUNNER_TEMP}/pi.zip"
          unzip -Z1 "${RUNNER_TEMP}/pi.zip" > "${RUNNER_TEMP}/pi-entries.txt"
          grep -Fxq "interface.json" "${RUNNER_TEMP}/pi-entries.txt"
          grep -Eq '^tasks/.+' "${RUNNER_TEMP}/pi-entries.txt"
          grep -Eq '^resource_pack/.+/pipeline/.+' "${RUNNER_TEMP}/pi-entries.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaaYYs-android-arm64-debug-${{ github.run_number }}
          path: MaaFwApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
